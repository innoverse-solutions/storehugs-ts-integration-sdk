name: Spec drift

# Regenerates the types from the published OpenAPI file and fails when they
# changed: the API moved on and the client needs a release.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Fail when the generated types changed
        run: git diff --exit-code src/schemas.ts
