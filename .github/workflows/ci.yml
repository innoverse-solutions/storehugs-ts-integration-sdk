name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run types:check
      - run: npm test
      - run: npm run build
      - name: The built package loads on this Node version
        run: node --input-type=module -e "const sdk = await import('./dist/index.js'); if (typeof sdk.AdminClient !== 'function' || typeof sdk.StorefrontClient !== 'function') process.exit(1);"
